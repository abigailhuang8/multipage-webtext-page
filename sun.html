  <h1>The Sun</h1>

  <img class="concept-image" src="images/sun.jpg" alt="Bright sunlight streaming into an open landscape">

  <p class="body-text">
    Outside the cave, the sun is the ultimate source of light and truth.
    When a freed prisoner finally sees it, after a painful adjustment, it
    represents the Form of the Good — the highest, most complete kind of
    knowledge, which makes everything else visible and understandable.
