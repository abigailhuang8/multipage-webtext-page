  <h1>The Fire</h1>

  <img class="concept-image" src="fire.jpg" alt="A flame glowing behind a low wall">

  <p class="body-text">
    The fire burns behind the prisoners, casting the shadows they mistake
    for reality. It's a source of light, but also an artificial, limited one.
    The fire represents the flawed or partial sources of knowledge that
    produce only shadows of the truth, not truth itself.
  </p>
